# Strategic merge patch for the reference solution.
spec:
  minReadySeconds: 10
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    spec:
      containers:
        - name: scout
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
