# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Repair A Stalled Rollout (LAB). Graded against the live cluster. Built
# untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-066-lab-010-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: scout runs three replicas with a strategy that lets half of
# the capacity go missing. A second revision (message "scout v2") is already
# released with a broken readiness probe, so the rollout is stalled.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the workloads and release the broken second revision of scout
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh
    - name: wait-for-settled
      description: Wait until only the three new scout pods are left
      type: file
      source: testing/wait-for-settled.sh

validation:
  scripts:
    - name: readiness-probe-fixed
      description: scout checks /readyz and keeps its original image
      type: file
      source: validation/validate-readiness-probe-fixed.sh
      hint: Read the events of a new scout pod with kubectl describe. The probe path is wrong. Correct it in the pod template and keep the image.
    - name: strategy-keeps-capacity
      description: The strategy is RollingUpdate with maxUnavailable 0 and maxSurge 1
      type: file
      source: validation/validate-strategy-keeps-capacity.sh
      hint: The fields are under spec.strategy.rollingUpdate. They are not part of the pod template, so changing them does not start a rollout.
    - name: timing-fields
      description: minReadySeconds is at least 10 and the progress deadline is 30 to 120 seconds
      type: file
      source: validation/validate-timing-fields.sh
      hint: Both fields are directly under spec. The deadline must be larger than minReadySeconds.
    - name: rollout-complete
      description: scout has 3 updated, ready and available replicas and no stalled progress
      type: file
      source: validation/validate-rollout-complete.sh
      hint: The check reads the Deployment status. Wait for kubectl rollout status to finish before you submit.
    - name: release-delivered
      description: All scout pods run the release with the message scout v2
      type: file
      source: validation/validate-release-delivered.sh
      hint: Fix forward. A rollback removes the message that the release must deliver.
    - name: change-cause-recorded
      description: The Deployment records a change cause and keeps its history
      type: file
      source: validation/validate-change-cause-recorded.sh
      hint: Annotate the Deployment with kubernetes.io/change-cause and a short text.

teardown:
  keepCluster: false
