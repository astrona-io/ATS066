# Reference objects for `astrona test`. The learner writes the same objects.
apiVersion: v1
kind: ConfigMap
metadata:
  name: scout-settings
  namespace: hold
data:
  mode: careful
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: hold
  labels:
    app: scout
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
    spec:
      containers:
        - name: scout
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
          env:
            - name: MODE
              valueFrom:
                configMapKeyRef:
                  name: scout-settings
                  key: mode
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
