apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: starfleet
resources:
  - ../../base
replicas:
  - name: scout
    count: 2
labels:
  - pairs:
      environment: starfleet
    includeSelectors: false
configMapGenerator:
  - name: scout-config
    behavior: merge
    literals:
      - PODINFO_UI_MESSAGE=scout from the overlay
