# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Declare Scout Configuration With Kustomize And Remove Drift (LAB). Graded
# against the live cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-066-lab-010-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

# Starting state: the Starfleet workloads, a Secret scout-token and a scout
# Deployment made by hand with `kubectl create`: five replicas and a message
# set in env. The learner's files do not exist yet.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the workloads, the Secret and the hand-made scout Deployment
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference Kustomize overlay and remove the hand-made env entry
      type: file
      source: solution/apply.sh
    - name: wait-for-settled
      description: Wait until exactly two scout pods are left
      type: file
      source: testing/wait-for-settled.sh

validation:
  scripts:
    - name: config-generated
      description: One generated ConfigMap scout-config-<hash> exists with the overlay message
      type: file
      source: validation/validate-config-generated.sh
      hint: Use a configMapGenerator in the base and merge a new literal in the overlay. Do not disable the name hash.
    - name: deployment-uses-generated-config
      description: The Deployment and its pods read the generated ConfigMap through envFrom
      type: file
      source: validation/validate-deployment-uses-generated-config.sh
      hint: A PODINFO_UI_MESSAGE entry in env wins over envFrom. kubectl apply does not remove an entry that was never in an applied manifest.
    - name: applied-from-overlay
      description: Objects carry the label environment=starfleet and were applied with kubectl apply
      type: file
      source: validation/validate-applied-from-overlay.sh
      hint: Use the labels field with includeSelectors false. Do not use commonLabels, it changes the selector.
    - name: secret-by-reference
      description: SCOUT_TOKEN refers to the existing Secret and no ConfigMap holds the value
      type: file
      source: validation/validate-secret-by-reference.sh
      hint: Add an env entry with valueFrom.secretKeyRef for scout-token and the key token. Never write the token value in a file.
    - name: declared-state-restored
      description: scout has 2 available replicas and the original image
      type: file
      source: validation/validate-declared-state-restored.sh
      hint: Run kubectl diff -k on your overlay to see the replica drift, then apply it.

teardown:
  keepCluster: false
