# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# CI/CD Concepts, Pipelines And Deployment Strategies (PLAYGROUND) - playground environment.
# A clean sandbox that starts and applies the example workloads, then stays
# running for free exploration. No task, no grading, no `astrona submit`.
# Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-066-playground-040-03
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - busybox:1.37

bootstrap:
  manifests:
    - name: scout-blue
      type: file
      source: manifests/scout-blue.yaml
  waitFor:
    - resource: deploy/scout-blue
      namespace: launch

teardown:
  keepCluster: false
