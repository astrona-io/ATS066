# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Promotion Delivery And Rollback (PLAYGROUND) - playground environment.
# A clean sandbox that starts and applies the example workloads, then stays
# running for free exploration. No task, no grading, no `astrona submit`.
# Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-066-playground-040-02
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - curlimages/curl:8.22.0

bootstrap:
  manifests:
    - name: environments
      type: file
      source: manifests/environments.yaml
  waitFor:
    - resource: deploy/scout
      namespace: staging
    - resource: deploy/scout
      namespace: production

teardown:
  keepCluster: false
