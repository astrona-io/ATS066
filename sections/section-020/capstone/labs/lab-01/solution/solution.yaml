# Equivalent end state for `astrona test`, which does not need OpenTofu.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: depot-quota
  namespace: depot
  labels:
    managed-by: opentofu
spec:
  hard:
    pods: "10"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: depot
  labels:
    app: relay
    managed-by: opentofu
spec:
  replicas: 2
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      containers:
        - name: relay
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - containerPort: 9898
          envFrom:
            - configMapRef:
                name: depot-settings
---
apiVersion: v1
kind: Service
metadata:
  name: relay
  namespace: depot
  labels:
    managed-by: opentofu
spec:
  selector:
    app: relay
  ports:
    - name: http
      port: 80
      targetPort: 9898
