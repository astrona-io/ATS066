# Starting state: namespace yard with the Deployment relay (selector app=relay)
# and a Service that selects the same label.
apiVersion: v1
kind: Namespace
metadata:
  name: yard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: yard
  labels:
    owner: platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      containers:
        - name: relay
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: relay
  namespace: yard
spec:
  selector:
    app: relay
  ports:
    - name: http
      port: 80
      targetPort: http
